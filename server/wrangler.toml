name = "cloudflare-d1-kv-auth-starter"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "trading-journal"
database_id = "6170cd24-b81e-469d-b96f-94ffc66cdc6e"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "4befc4c67b324893b92aa5881ba6c30f"

routes = [
  { pattern = "www.your-custom.domain", custom_domain = true }
]

# Production environment
[env.production]

[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "d1-auth"
database_id = "YOUR-DATABASE-ID"
migrations_dir = "drizzle"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "YOUR-KV-ID"
preview_id = "YOUR-KV-ID"

[env.production.vars]
NODE_ENV = "production"

# Development environment
[env.development]

[[env.development.d1_databases]]
binding = "AUTH_DB"
database_name = "d1-auth"
database_id = "YOUR-DATABASE-ID"
migrations_dir = "drizzle"

[[env.development.kv_namespaces]]
binding = "SESSION_KV"
id = "YOUR-KV-ID"
preview_id = "YOUR-KV-ID"
